name: Landing CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - name: Verify static routes and version asset
        run: |
          test -f dist/landing-shipframe/browser/index.html
          test -f dist/landing-shipframe/browser/es/index.html
          grep -Fq 'Current version: v0.6.0' dist/landing-shipframe/browser/llms.txt
