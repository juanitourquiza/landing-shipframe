name: Deploy to Cloudways

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never run two production deploys at once; newer push wins.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static prerender)
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/landing-shipframe/browser/en/index.html
          test -f dist/landing-shipframe/browser/es/index.html
          test -f dist/landing-shipframe/browser/.htaccess
          echo "Build output verified."

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy via rsync (password auth)
        env:
          SSHPASS: ${{ secrets.CLOUDWAYS_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.CLOUDWAYS_SSH_HOST }}
          SSH_USER: ${{ secrets.CLOUDWAYS_SSH_USER }}
          SSH_PORT: ${{ secrets.CLOUDWAYS_SSH_PORT }}
          REMOTE_PATH: ${{ secrets.CLOUDWAYS_REMOTE_PATH }}
        run: |
          rsync -rlvz --delete \
            --exclude='.well-known' \
            -e "sshpass -e ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no" \
            dist/landing-shipframe/browser/ \
            "${SSH_USER}@${SSH_HOST}:${REMOTE_PATH:-public_html}/"

      - name: Smoke check (production)
        run: |
          for url in "https://shipframe.hackeruna.com/en/" "https://shipframe.hackeruna.com/es/" "https://shipframe.hackeruna.com/llms.txt"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
            echo "$code  $url"
            [ "$code" = "200" ] || echo "::warning::$url returned $code"
          done
