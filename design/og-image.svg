<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070a14"/>
      <stop offset="1" stop-color="#0d1326"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- grid -->
  <g stroke="#818cf8" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630"/>
  </g>

  <!-- logo mark -->
  <g transform="translate(90, 96)">
    <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#mark)"/>
    <path d="M27 66 48 26l21 40" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M35 51h26" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="210" y="164" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800" fill="#e8ebf5">ShipFrame</text>

  <!-- headline -->
  <text x="90" y="330" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="#e8ebf5">AI coding workflows</text>
  <text x="90" y="416" font-family="Inter, Arial, sans-serif" font-size="72" font-weight="800" fill="url(#brand)">plan · prove · ship</text>

  <!-- subtitle -->
  <text x="90" y="486" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500" fill="#9aa4bd">A disciplined lifecycle for Claude Code, Codex CLI &amp; OpenCode.</text>

  <!-- footer row -->
  <g font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600">
    <rect x="90" y="536" width="230" height="52" rx="26" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-opacity="0.4"/>
    <text x="118" y="570" fill="#a5b4fc">Open source · MIT</text>
    <text x="360" y="570" fill="#6b7488">shipframe.hackeruna.com</text>
  </g>
</svg>
