<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ShipFrame — AI Coding Workflows for Teams that Plan, Prove & Ship</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6366f1" />
    <meta
      name="description"
      content="ShipFrame is an open-source AI coding workflow toolkit for Claude Code, Codex CLI and OpenCode. Plan, implement, verify, review and ship with real release evidence."
    />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="manifest" href="site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Prevent theme flash: apply stored/system theme before first paint -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme');
          var t = localStorage.getItem('shipframe-theme');
          var dark = q ? q === 'dark' : t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
